[package]
name = "hyper-use-resonance"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Deterministic locate ranking for a static hyper-use manifold"

[dependencies]
hyper-use-core = { path = "../hyper-use-core" }
hyper-use-geometry = { path = "../hyper-use-geometry" }
hyper-use-hyper = { path = "../../experiments/hgra/hyper-use-hyper", optional = true }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }

[features]
default = []
# Experimental HGRA matcher. Not the product default.
hgra = ["dep:hyper-use-hyper"]

[dev-dependencies]
proptest = "1.7"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }
