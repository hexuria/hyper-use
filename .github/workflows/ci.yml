name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt
      # Miri, Loom, and Kani are not justified: no unsafe, no atomics, no threads.
      # Browser tests use a CDP replay fixture. The ignored live test is not in CI.
      # cargo-semver-checks is not justified until a crate is published.
      # See docs/DECISIONS.md.
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Optional HGRA experiment still compiles behind its feature.
      - run: cargo test -p hyper-use-resonance --features hgra
      - run: cargo clippy -p hyper-use-cli --all-targets --features jev -- -D warnings
      - run: cargo test -p hyper-use-cli --features jev
      # Optional remote escalation (arm D) behind its feature.
      - run: cargo test -p hyper-use-policy -p hyper-use-agent --features hyper-use-agent/remote,hyper-use-policy/remote
      # Optional model-text TextResolver: scripted / local-command models only (no network, no keys).
      - run: cargo clippy -p hyper-use-policy -p hyper-use-agent -p hyper-use-cli --all-targets --features hyper-use-policy/model-text,hyper-use-agent/model-text,hyper-use-cli/model-text -- -D warnings
      - run: cargo test -p hyper-use-policy -p hyper-use-agent -p hyper-use-cli --features hyper-use-policy/model-text,hyper-use-agent/model-text,hyper-use-cli/model-text
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
