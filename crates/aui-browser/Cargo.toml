[package]
name = "aui-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "CDP browser session for ultra-instinct. Replay and websocket share one client."

[dependencies]
aui-observe = { path = "../aui-observe" }
aui-core = { path = "../aui-core" }
aui-geometry = { path = "../aui-geometry" }
serde_json = "1"
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }

[dev-dependencies]
aui-resonance = { path = "../aui-resonance" }
proptest = "1.7"

[features]
# Fuzz-only entry points for aui-fuzz (fuzz/fuzz_targets/). Not part of
# the product surface; nothing on the agent path uses them.
fuzz-support = []
