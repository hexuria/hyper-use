[package]
name = "aui-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "CDP browser session for ultra-instinct."

[dependencies]
aui-cdp = { path = "../aui-cdp" }
aui-observe = { path = "../aui-observe" }
aui-core = { path = "../aui-core" }
aui-geometry = { path = "../aui-geometry" }
serde = "1"
serde_json = { version = "1", features = ["unbounded_depth"] }
serde_stacker = "0.1"

[dev-dependencies]
aui-resonance = { path = "../aui-resonance" }
proptest = "1.7"

[features]
# Fuzz-only entry points for aui-fuzz (fuzz/fuzz_targets/). Not part of
# the product surface; nothing on the agent path uses them.
fuzz-support = []
