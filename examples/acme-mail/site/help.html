<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Help - Acme Mail</title>
<style>
  :root { --page: #f6f8fc; --text: #1f1f1f; --muted: #5e5e5e; --line: #eceff1; --blue: #0b57d0; --blue-hover: #0a4cba; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text);
         font: 14px/20px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  a { color: inherit; text-decoration: none; }
  button, input, textarea, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .topbar { height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 16px; }
  .brand { display: flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 400; color: #444746; margin: 0 24px 0 8px; white-space: nowrap; }
  .back { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 18px; color: #444746; white-space: nowrap; }
  .back:hover { background: rgba(68,71,70,.08); }
  .panel { background: #fff; border-radius: 16px; margin: 0 16px 16px; min-height: calc(100vh - 80px); }
  .panel-head { padding: 20px 28px 0; border-bottom: 1px solid var(--line); }
  .panel-head h2 { font-size: 22px; font-weight: 400; margin: 0 0 12px; }
  .tabs { display: flex; gap: 4px; }
  .tab { padding: 10px 16px; border: 0; background: transparent; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; cursor: pointer; }
  .tab[aria-selected="true"] { color: var(--blue); border-bottom-color: var(--blue); font-weight: 500; }
  .setting { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 24px; padding: 22px 28px; border-bottom: 1px solid var(--line); }
  .setting h3 { font-size: 14px; font-weight: 600; margin: 0 0 4px; }
  .setting p { color: var(--muted); margin: 0; }
  .controls { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
  .controls label { display: flex; align-items: center; gap: 8px; }
  .controls textarea { width: 100%; max-width: 560px; min-height: 90px; border: 1px solid #c4c7c5; border-radius: 8px; padding: 10px 12px; resize: vertical; }
  .pill { display: inline-flex; align-items: center; height: 36px; padding: 0 24px; border: 0; border-radius: 18px; background: var(--blue); color: #fff; font-weight: 500; white-space: nowrap; cursor: pointer; }
  .pill:hover { background: var(--blue-hover); }
  .pill:disabled { background: #e3e3e3; color: #8a8a8a; cursor: not-allowed; }
  .article { padding: 24px 28px; max-width: 820px; }
  .article h3 { font-size: 16px; font-weight: 600; margin: 24px 0 8px; }
  .article li { margin: 6px 0; }
  .article a { color: var(--blue); }
  .search { display: flex; align-items: center; height: 48px; max-width: 640px; padding: 0 18px; background: #e9eef6; border-radius: 24px; margin: 8px 0 16px; }
  .search input { flex: 1; border: 0; background: transparent; outline: none; font-size: 16px; }
  .hidden { display: none !important; }
  .snackbar { position: fixed; left: 24px; bottom: 24px; display: flex; align-items: center; gap: 24px; background: #303030; color: #f2f2f2;
              padding: 0 8px 0 24px; height: 48px; border-radius: 4px; box-shadow: 0 6px 10px rgba(0,0,0,.14); white-space: nowrap; }
  .snackbar button { border: 0; background: transparent; color: #a8c7fa; font-weight: 500; padding: 8px 12px; border-radius: 4px; }
</style>
</head>
<body>
<header class="topbar">
  <h1 class="brand"><svg width="32" height="26" viewBox="0 0 32 26" aria-hidden="true"><rect x="1" y="1" width="30" height="24" rx="4" fill="#fff" stroke="#c4c7c5"/><path d="M2 3l14 11L30 3" stroke="#0b57d0" stroke-width="3" fill="none" stroke-linejoin="round"/></svg>Acme Mail</h1>
  <a class="back" href="index.html"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5M11 6l-6 6 6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>Back to Inbox</a>
</header>
<main class="panel">
  <div class="article">
    <h2 style="font-size:28px;font-weight:400;margin:8px 0 4px">Acme Mail Help</h2>
    <div class="search"><input type="search" aria-label="Search help articles" placeholder="Describe your issue"></div>
    <h3>Popular articles</h3>
    <ul>
      <li><a href="#undo">Undo a sent message</a></li>
      <li><a href="#cc">Add Cc and Bcc recipients</a></li>
      <li><a href="#signature">Create a signature</a></li>
      <li><a href="#vacation">Set up a vacation responder</a></li>
    </ul>
  </div>
</main>
<script src="/_shared/bench.js"></script>
<script>BENCH.set({ view: "help" });</script>
</body>
</html>
