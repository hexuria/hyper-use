[package]
name = "aui-resonance"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Deterministic locate ranking for a static ultra-instinct manifold"

[dependencies]
aui-core = { path = "../aui-core" }
aui-geometry = { path = "../aui-geometry" }
aui-hyper = { path = "../../experiments/hgra/aui-hyper", optional = true }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }

[features]
default = []
# Experimental HGRA matcher. Not the product default.
hgra = ["dep:aui-hyper"]

[dev-dependencies]
proptest = "1.7"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }
