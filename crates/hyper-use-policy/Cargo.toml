[package]
name = "hyper-use-policy"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Browser policy: PUA finite decisions + optional escalation. Hard invalidity stays in guard."

[features]
default = []
# Optional remote/Jev-shaped fallback. Not required to build or run PUA-only agents.
remote = ["dep:serde_json"]
# Model-backed TextResolver for TYPE_TEXT / SELECT payloads. Injectable
# `TextModel`; CI uses scripted models. Deterministic resolver stays default.
model-text = ["dep:serde_json"]

[dependencies]
hyper-use-core = { path = "../hyper-use-core" }
pua-core = { workspace = true }
pua-text = { workspace = true }
pua-lexicon = { workspace = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
