<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Servers</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 24px; background: #fff; }
  table { border-collapse: collapse; width: 100%; max-width: 1100px; }
  th, td { border-bottom: 1px solid #e5e7eb; padding: 12px 8px; text-align: left; }
  input { width: 280px; padding: 8px; }
  button { padding: 8px 14px; }
</style>
</head>
<body>
<h1>Servers</h1>
<table>
  <thead><tr><th>Hostname</th><th></th></tr></thead>
  <tbody>
    <tr role="row" aria-label="alpha">
      <td><input aria-label="Hostname" id="alpha-host" value="alpha.example"></td>
      <td><button type="button" id="alpha-suspend">Suspend</button></td>
    </tr>
    <tr role="row" aria-label="beta">
      <td><input aria-label="Hostname" id="beta-host" value="beta.example" autofocus></td>
      <td><button type="button" id="beta-suspend">Suspend</button></td>
    </tr>
  </tbody>
</table>
<script>
  // Ensure focus lands on beta's Hostname (cursor / cargo-runner analogue).
  const beta = document.getElementById('beta-host');
  beta.focus();
  // Some headless builds ignore autofocus; re-assert after a tick.
  requestAnimationFrame(() => beta.focus());
</script>
</body>
</html>
