[workspace]
resolver = "2"
members = [
    "crates/hyper-use-core",
    "crates/hyper-use-geometry",
    "crates/hyper-use-observe",
    "crates/hyper-use-resonance",
    "crates/hyper-use-browser",
    "crates/hyper-use-protocol",
    "crates/hyper-use-guard",
    "crates/hyper-use-policy",
    "crates/hyper-use-agent",
    "crates/hyper-use-mcp",
    "crates/hyper-use-cli",
    # Experimental. Not on the product path. Build with -p hyper-use-hyper --features unused
    # or via hyper-use-resonance's `hgra` feature.
    "experiments/hgra/hyper-use-hyper",
]
# Deleted from the product graph (see docs/DECISIONS.md product pivot):
# hyper-use-browser-use, hyper-use-cua, hyper-use-macos, hyper-use-executor

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.99"


[workspace.dependencies]
# Pinned Exact: hexuria/pua @ fe3f1fd (ADR 0001 / Phase 2). Bump only with deliberate eval.
pua-core = { git = "https://github.com/hexuria/pua", rev = "fe3f1fd3818feb452fae1771ff2171b8598f86e6" }
pua-text = { git = "https://github.com/hexuria/pua", rev = "fe3f1fd3818feb452fae1771ff2171b8598f86e6" }
pua-lexicon = { git = "https://github.com/hexuria/pua", rev = "fe3f1fd3818feb452fae1771ff2171b8598f86e6" }
