[workspace]
resolver = "2"
members = [
    "crates/ultra-instinct-core",
    "crates/ultra-instinct-geometry",
    "crates/ultra-instinct-observe",
    "crates/ultra-instinct-resonance",
    "crates/ultra-instinct-browser",
    "crates/ultra-instinct-protocol",
    "crates/ultra-instinct-guard",
    "crates/ultra-instinct-policy",
    "crates/ultra-instinct-agent",
    "crates/ultra-instinct-mcp",
    "crates/ultra-instinct-cli",
    # Experimental. Not on the product path. Build with -p ultra-instinct-hyper --features unused
    # or via ultra-instinct-resonance's `hgra` feature.
    "experiments/hgra/ultra-instinct-hyper",
]
# Deleted from the product graph (see docs/DECISIONS.md product pivot):
# ultra-instinct-browser-use, ultra-instinct-cua, ultra-instinct-macos, ultra-instinct-executor

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.99"


[workspace.dependencies]
# Pinned Exact: hexuria/instinct @ a42d16b (ADR 0008). Bump only with deliberate eval.
instinct-core = { git = "https://github.com/hexuria/instinct", rev = "a42d16b6f5ccc3273939c8e3d3f462d78765bfea" }
instinct-text = { git = "https://github.com/hexuria/instinct", rev = "a42d16b6f5ccc3273939c8e3d3f462d78765bfea" }
instinct-lexicon = { git = "https://github.com/hexuria/instinct", rev = "a42d16b6f5ccc3273939c8e3d3f462d78765bfea" }
