[package]
name = "aui-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Observe → decide → guard → ticket → execute → verify agent loop"

[features]
default = []
# Model-backed TextResolver (`AgentBuilder::model_text`). Off by default;
# `DeterministicTextResolver` stays the default resolver even when enabled.
model-text = ["aui-policy/model-text"]
# Arm D: Instinct → remote fallback (consumer-supplied transport; no Jev dependency).
remote = ["aui-policy/remote"]

[dependencies]
aui-core = { path = "../aui-core" }
aui-browser = { path = "../aui-browser" }
aui-guard = { path = "../aui-guard" }
aui-observe = { path = "../aui-observe" }
aui-policy = { path = "../aui-policy" }
aui-protocol = { path = "../aui-protocol" }

[dev-dependencies]
proptest = "1.11"
serde_json = "1"
