[package]
name = "hyper-use-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "hyper-use command line"

[dependencies]
hyper-use-core = { path = "../hyper-use-core" }
hyper-use-hyper = { path = "../hyper-use-hyper" }
hyper-use-resonance = { path = "../hyper-use-resonance" }
hyper-use-browser = { path = "../hyper-use-browser" }
hyper-use-executor = { path = "../hyper-use-executor" }
hyper-use-observe = { path = "../hyper-use-observe" }
hyper-use-mcp = { path = "../hyper-use-mcp" }

[lib]
name = "hyper_use_cli"
path = "src/lib.rs"

[[bin]]
name = "hyper-use"
path = "src/main.rs"

[features]
default = []
# Optional System One client. Not part of `cargo build` or `cargo test`.
jev = ["dep:typesafe-sdk", "dep:serde_json"]

[dependencies.typesafe-sdk]
version = "0.2.0"
optional = true
default-features = false
features = ["blocking"]

[dependencies.serde_json]
version = "1"
optional = true

