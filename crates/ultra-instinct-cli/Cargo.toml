[package]
name = "ultra-instinct-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "ultra-instinct command line"

[dependencies]
ultra-instinct-core = { path = "../ultra-instinct-core" }
ultra-instinct-resonance = { path = "../ultra-instinct-resonance" }
ultra-instinct-browser = { path = "../ultra-instinct-browser" }
ultra-instinct-guard = { path = "../ultra-instinct-guard" }
ultra-instinct-observe = { path = "../ultra-instinct-observe" }
ultra-instinct-mcp = { path = "../ultra-instinct-mcp" }
ultra-instinct-protocol = { path = "../ultra-instinct-protocol" }
ultra-instinct-agent = { path = "../ultra-instinct-agent" }
ultra-instinct-policy = { path = "../ultra-instinct-policy" }

[dev-dependencies]
serde_json = "1"

[lib]
name = "ultra_instinct_cli"
path = "src/lib.rs"

[[example]]
# Manual, opt-in live drive with JEV. Historical; product path is observe/guard/verify.
name = "live_drive"
required-features = ["jev"]

[[bin]]
name = "ultra-instinct"
path = "src/main.rs"

[features]
default = []
# Optional System One client. Not part of `cargo build` or `cargo test`.
jev = ["dep:typesafe-sdk", "dep:serde_json", "ultra-instinct-policy/remote"]
# Experimental HGRA matcher (wires into ultra-instinct-mcp / mcp locate+guard).
hgra = ["ultra-instinct-mcp/hgra"]
# Model-backed TYPE_TEXT / SELECT payloads via `run --text-model-cmd <program>`.
model-text = ["ultra-instinct-agent/model-text", "ultra-instinct-policy/model-text"]

[dependencies.typesafe-sdk]
version = "0.2.0"
optional = true
default-features = false
features = ["blocking"]

[dependencies.serde_json]
version = "1"
optional = true
