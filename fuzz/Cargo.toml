# cargo-fuzz targets (nightly, dated: see $NIGHTLY in .github/workflows/nightly.yml).
# Not a workspace member: it needs nightly and libfuzzer-sys. Run: scripts/fuzz-smoke.sh 60
[package]
name = "aui-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
aui-core = { path = "../crates/aui-core" }
aui-browser = { path = "../crates/aui-browser", features = ["fuzz-support"] }
aui-mcp = { path = "../crates/aui-mcp" }
aui-policy = { path = "../crates/aui-policy", features = ["remote", "model-text"] }
aui-dojo = { path = "../crates/aui-dojo" }

[[bin]]
name = "fixture"
path = "fuzz_targets/fixture.rs"
test = false
doc = false
bench = false

[[bin]]
name = "replay_cdp"
path = "fuzz_targets/replay_cdp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mcp_rpc"
path = "fuzz_targets/mcp_rpc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "remote_reply"
path = "fuzz_targets/remote_reply.rs"
test = false
doc = false
bench = false

[[bin]]
name = "command_reply"
path = "fuzz_targets/command_reply.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compact_snapshot"
path = "fuzz_targets/compact_snapshot.rs"
test = false
doc = false
bench = false

[[bin]]
name = "diary_line"
path = "fuzz_targets/diary_line.rs"
test = false
doc = false
bench = false
