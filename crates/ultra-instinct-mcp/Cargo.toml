[package]
name = "ultra-instinct-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "stdio JSON-RPC MCP server for the ultra-instinct action firewall"

[dependencies]
ultra-instinct-protocol = { path = "../ultra-instinct-protocol" }
ultra-instinct-core = { path = "../ultra-instinct-core" }
ultra-instinct-resonance = { path = "../ultra-instinct-resonance" }
ultra-instinct-browser = { path = "../ultra-instinct-browser" }
ultra-instinct-guard = { path = "../ultra-instinct-guard" }
ultra-instinct-observe = { path = "../ultra-instinct-observe" }
serde_json = "1"

[dev-dependencies]
proptest = "1.7"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }

[features]
# Experimental HGRA matcher for live remasure (world_context_live).
hgra = ["ultra-instinct-resonance/hgra"]
