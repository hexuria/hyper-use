name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt
      # Miri, Loom, and Kani are not justified: no unsafe, no atomics, no threads.
      # Browser tests use a CDP replay fixture. The ignored live test is not in CI.
      # cargo-deny / RUSTSEC is useful later and skipped: cargo-deny is not
      # installed here, and no crate is network-facing or unsafe.
      # cargo-semver-checks is not justified until a crate is published.
      # Wall-clock is not a regression gate. The 2000-region test is a smoke
      # check with a 10s debug ceiling. See docs/DECISIONS.md.
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
