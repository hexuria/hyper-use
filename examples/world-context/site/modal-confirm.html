<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Project settings</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7f9; }
  main { padding: 48px; }
  .actions { position: fixed; right: 40px; bottom: 40px; display: flex; gap: 12px; }
  button { padding: 10px 16px; font-size: 14px; border-radius: 8px; border: 1px solid #ccc; background: #fff; }
  button.danger { background: #c62828; color: #fff; border-color: #c62828; }
  dialog {
    border: none; border-radius: 12px; padding: 24px; width: 400px;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
  }
  dialog::backdrop { background: rgba(15, 23, 42, 0.45); }
  dialog .row { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }
</style>
</head>
<body>
<main>
  <h1>Project settings</h1>
  <p>Deleting the project is permanent.</p>
</main>
<div class="actions">
  <button type="button" id="page-cancel">Cancel</button>
  <button type="button" class="danger" id="page-delete">Delete project</button>
</div>
<dialog id="confirm" aria-modal="true" aria-label="Delete project?">
  <h2>Delete project?</h2>
  <p>This cannot be undone.</p>
  <div class="row">
    <button type="button" id="confirm-cancel">Cancel</button>
    <button type="button" class="danger" id="confirm-delete">Delete</button>
  </div>
</dialog>
<script>
  // Open on load so observe sees the front layer without a prior click.
  const dialog = document.getElementById('confirm');
  dialog.showModal();
</script>
</body>
</html>
