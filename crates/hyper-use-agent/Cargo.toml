[package]
name = "hyper-use-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Observe → decide → guard → ticket → execute → verify agent loop"

[features]
default = []
# Model-backed TextResolver (`AgentBuilder::model_text`). Off by default;
# `DeterministicTextResolver` stays the default resolver even when enabled.
model-text = ["hyper-use-policy/model-text"]
# Arm D: Instinct → remote fallback (consumer-supplied transport; no Jev dependency).
remote = ["hyper-use-policy/remote"]

[dependencies]
hyper-use-core = { path = "../hyper-use-core" }
hyper-use-browser = { path = "../hyper-use-browser" }
hyper-use-guard = { path = "../hyper-use-guard" }
hyper-use-observe = { path = "../hyper-use-observe" }
hyper-use-policy = { path = "../hyper-use-policy" }
hyper-use-protocol = { path = "../hyper-use-protocol" }

[dev-dependencies]
proptest = "1.11"
serde_json = "1"
