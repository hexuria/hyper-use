[package]
name = "hyper-use-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "hyper-use command line"

[dependencies]
hyper-use-core = { path = "../hyper-use-core" }
hyper-use-resonance = { path = "../hyper-use-resonance" }
hyper-use-browser = { path = "../hyper-use-browser" }
hyper-use-guard = { path = "../hyper-use-guard" }
hyper-use-observe = { path = "../hyper-use-observe" }
hyper-use-mcp = { path = "../hyper-use-mcp" }
hyper-use-protocol = { path = "../hyper-use-protocol" }
hyper-use-agent = { path = "../hyper-use-agent" }
hyper-use-policy = { path = "../hyper-use-policy" }

[dev-dependencies]
serde_json = "1"

[lib]
name = "hyper_use_cli"
path = "src/lib.rs"

[[example]]
# Manual, opt-in live drive with JEV. Historical; product path is observe/guard/verify.
name = "live_drive"
required-features = ["jev"]

[[bin]]
name = "hyper-use"
path = "src/main.rs"

[features]
default = []
# Optional System One client. Not part of `cargo build` or `cargo test`.
jev = ["dep:typesafe-sdk", "dep:serde_json"]
# Experimental HGRA matcher (wires into hyper-use-mcp / mcp locate+guard).
hgra = ["hyper-use-mcp/hgra"]
# Model-backed TYPE_TEXT / SELECT payloads via `run --text-model-cmd <program>`.
model-text = ["hyper-use-agent/model-text", "hyper-use-policy/model-text"]

[dependencies.typesafe-sdk]
version = "0.2.0"
optional = true
default-features = false
features = ["blocking"]

[dependencies.serde_json]
version = "1"
optional = true
