[profile.default]
retries = 0
fail-fast = false

# CI profile: no retries (a flaky test is a bug in a deterministic suite), JUnit for artifacts.
[profile.ci]
retries = 0
fail-fast = false
failure-output = "immediate-final"
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci.junit]
path = "junit.xml"
