[package]
name = "ultra-instinct-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "CDP browser session for ultra-instinct. Replay and websocket share one client."

[dependencies]
ultra-instinct-observe = { path = "../ultra-instinct-observe" }
ultra-instinct-core = { path = "../ultra-instinct-core" }
ultra-instinct-geometry = { path = "../ultra-instinct-geometry" }
serde_json = "1"
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }

[dev-dependencies]
ultra-instinct-resonance = { path = "../ultra-instinct-resonance" }
proptest = "1.7"

[features]
# Fuzz-only entry points for ultra-instinct-fuzz (fuzz/fuzz_targets/). Not part of
# the product surface; nothing on the agent path uses them.
fuzz-support = []
